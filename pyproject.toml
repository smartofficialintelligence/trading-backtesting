[project]
name = "qresearch"
version = "0.0.1"
description = "Research and backtesting platform for systematic intraday strategies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    # DuckDB routes TIMESTAMPTZ <-> Python datetime through pytz.
    "pytz>=2024.1",
]

[project.scripts]
qresearch = "qresearch.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qresearch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "DTZ", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qresearch"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Neither ships a py.typed marker.
module = ["duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
