[project]
name = "qresearch"
version = "0.0.1"
description = "Research and backtesting platform for systematic intraday strategies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    # DuckDB routes TIMESTAMPTZ <-> Python datetime through pytz.
    "pytz>=2024.1",
]

[project.scripts]
qresearch = "qresearch.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    # starlette's TestClient needs this to exercise the UI routes.
    "httpx2>=0.1",
]
ui = [
    # Local research UI. Optional: the CLI and library work without it.
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
oracle = [
    # Independent simulator used only by the differential test in
    # tests/integration/test_oracle_differential.py. Not needed to run qresearch.
    "backtesting>=0.6",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qresearch"]
# The UI's JS/CSS live beside the package and must ship with it.
artifacts = ["src/qresearch/ui/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "DTZ", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qresearch"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Neither ships a py.typed marker.
module = ["duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # starlette's TestClient trips an anyio alias deprecation on import. Third-party and
    # out of our control; matched by message so our own deprecations still fail the suite.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    # Hits a live venue. Deselected by default so the suite is hermetic and CI does not
    # depend on a third party being reachable: QRESEARCH_NETWORK_TESTS=1 to enable.
    "network: requires outbound network access to a market-data venue",
    # Differential test against an independent simulator; needs the 'oracle' extra.
    "oracle: compares results against an external backtesting library",
]
